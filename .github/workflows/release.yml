name: Release

# push tag（如 v1.0.0）时自动打包部署 zip 并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deploy zip
        run: |
          mkdir -p dist
          zip -r dist/ai-eqflow-mcp-deploy.zip \
            install.py install.bat setup.ps1 README.md LICENSE server/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-eqflow-mcp-deploy.zip
          generate_release_notes: true
